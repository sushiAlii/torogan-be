name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.26.x"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

      - name: Verify go.mod/go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || {
            echo "::error::go.mod/go.sum are out of date — run 'go mod tidy' and commit the result."
            exit 1
          }

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: torogan_db
          POSTGRES_USER: torogan_user
          POSTGRES_PASSWORD: torogan_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U torogan_user -d torogan_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: torogan_db
      DB_USER: torogan_user
      DB_PASSWORD: torogan_password
      DB_SSLMODE: disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        run: go build ./...

      - name: Apply migrations (also serves as a migration smoke test)
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}/internal/database/migrations:/migrations" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database "postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSLMODE}" \
            up

      - name: Test
        run: go test ./...

  deploy:
    name: Deploy to production
    needs: [lint, build-and-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ap-southeast-1
      INSTANCE_ID: i-05efbba00e4330079
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::522882358269:role/torogan-be-gh-deploy
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build -f Dockerfile.prod -t $ECR_REGISTRY/torogan-be:$GITHUB_SHA .
          docker build -f Dockerfile.migrations -t $ECR_REGISTRY/torogan-be-migrations:$GITHUB_SHA .
          docker push $ECR_REGISTRY/torogan-be:$GITHUB_SHA
          docker push $ECR_REGISTRY/torogan-be-migrations:$GITHUB_SHA

      - name: Deploy via SSM
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          COMPOSE=$(base64 -w0 docker-compose.prod.yml)
          CADDY=$(base64 -w0 Caddyfile)
          SCRIPT=$(base64 -w0 scripts/remote-deploy.sh)
          CMD=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA:0:7}" \
            --parameters "commands=[
              \"set -euo pipefail\",
              \"echo $COMPOSE | base64 -d > /home/ubuntu/docker-compose.prod.yml\",
              \"echo $CADDY | base64 -d > /home/ubuntu/Caddyfile\",
              \"echo $SCRIPT | base64 -d > /home/ubuntu/remote-deploy.sh\",
              \"chmod +x /home/ubuntu/remote-deploy.sh\",
              \"IMAGE_TAG=$GITHUB_SHA ECR_REGISTRY=$ECR_REGISTRY bash /home/ubuntu/remote-deploy.sh\"
            ]" --query 'Command.CommandId' --output text)

          aws ssm wait command-executed --command-id "$CMD" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Out:StandardOutputContent,Err:StandardErrorContent}' --output text
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD" \
            --instance-id "$INSTANCE_ID" --query 'Status' --output text)
          [ "$STATUS" = "Success" ] || exit 1

      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' https://api.torogan.com/v1/features)
            [ "$CODE" = "200" ] && echo "healthy" && exit 0
            sleep 5
          done
          echo "smoke test failed (last status $CODE)" && exit 1
