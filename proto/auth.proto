syntax = "proto3";

package auth.v1;

option go_package = "github.com/sushiAlii/torogan-be/gen/authv1;authv1";

import "google/api/annotations.proto";

service AuthService {
    rpc SignInWithGoogle(SignInWithGoogleRequest) returns (SignInWithGoogleResponse) {
        option (google.api.http) = {
            post: "/v1/auth/google/signin"
            body: "*"
        };
    }
    rpc Register(RegisterRequest) returns (RegisterResponse) {
        option (google.api.http) = {
            post: "/v1/auth/register"
            body: "*"
        };
    }
    rpc Login(LoginRequest) returns (LoginResponse) {
        option (google.api.http) = {
            post: "/v1/auth/login"
            body: "*"
        };
    }
    rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse) {
        option (google.api.http) = {
            post: "/v1/auth/refresh"
            body: "*"
        };
    }
    rpc Logout(LogoutRequest) returns (LogoutResponse) {
        option (google.api.http) = {
            post: "/v1/auth/logout"
            body: "*"
        };
    }
    // VerifyEmail consumes a short-lived token from a verification email link
    // and marks the corresponding user's email as verified.
    rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse) {
        option (google.api.http) = {
            post: "/v1/auth/verify-email"
            body: "*"
        };
    }
    // ResendVerificationEmail re-sends the verification email for an
    // unverified account. Always reports success regardless of whether the
    // address exists, to avoid leaking account existence.
    rpc ResendVerificationEmail(ResendVerificationEmailRequest) returns (ResendVerificationEmailResponse) {
        option (google.api.http) = {
            post: "/v1/auth/resend-verification"
            body: "*"
        };
    }
}

message SignInWithGoogleRequest {
    string id_token = 1;
}

message SignInWithGoogleResponse {
    string access_token = 1;
    User user = 2;
}

message RegisterRequest {
    string email = 1;
    string password = 2;
    string name = 3;
    string phone = 4;
}

message RegisterResponse {
    // access_token is empty when email_verification_required is true — the
    // caller is not logged in until they verify their email.
    string access_token = 1;
    User user = 2;
    bool email_verification_required = 3;
}

message LoginRequest {
    string email = 1;
    string password = 2;
}

message LoginResponse {
    string access_token = 1;
    User user = 2;
}

message RefreshTokenRequest {}

message RefreshTokenResponse {
    string access_token = 1;
    User user = 2;
}

message LogoutRequest {}

message LogoutResponse {
    bool success = 1;
}

message VerifyEmailRequest {
    string token = 1;
}

message VerifyEmailResponse {
    bool success = 1;
}

message ResendVerificationEmailRequest {
    string email = 1;
}

message ResendVerificationEmailResponse {
    bool success = 1;
}

message User {
  string id = 1;
  string email = 2;
  string avatar_url = 3;
  string role = 4;
  string name = 5;
  string phone = 6;
  bool email_verified = 7;
}